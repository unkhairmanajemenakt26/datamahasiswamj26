        // Format HP to clean WhatsApp URL
        function cleanPhone(phone) {
            if(!phone) return '';
            let cleaned = phone.replace(/[^0-9]/g, '');
            if (cleaned.startsWith('0')) {
                cleaned = '62' + cleaned.substring(1);
            }
            return cleaned;
        }

            }

        function showApp() {
            document.getElementById('loginModal').classList.add('hidden');

            sessionStorage.removeItem('isLoggedIn');

        // Filter Functionality
        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedClass = document.getElementById('classFilter').value;

            const filtered = rawMahasiswa.filter(item => {
                const matchSearch = item.nama.toLowerCase().includes(query) || item.npm.includes(query);
                const matchClass = selectedClass === "" || item.kelas === selectedClass;
                return matchSearch && matchClass;
            });

            renderCards(filtered);
        }
